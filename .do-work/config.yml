# do-work configuration
# Edit this file to customize agent behavior.
# Full schema and defaults: agents/config.md (canonical template)

project:
  name: 'movie-world'

# Electron app layers, mirroring the process boundaries in the design spec and
# the src/ file structure in the plan:
#   shared    — src/shared/* domain types consumed by every process
#   main      — src/main/* filesystem/network/TMDB/player/manager logic
#   preload   — src/preload/* contextBridge window.api surface
#   renderer  — src/renderer/* Vue UI, Pinia store, filtering
#   packaging — scaffold, tooling, electron-builder, README
layers: [shared, main, preload, renderer, packaging]

test:
  suite_command: 'npx vitest run'

log:
  enabled: true
  platforms: [] # e.g. [x, linkedin]
  drafts_per_platform: 2
  batch_size: 2 # drafts per batch (2 drafts + More + Skip = 4 options in AskUserQuestion)
  audience: '' # e.g. "indie hackers", "enterprise devs", "startup founders"
  voice: '' # e.g. "casual and direct", "thoughtful and technical"
  max_chars: # per-platform character ceiling the log agent must keep each draft under
    x: 280
    blog: 500
    linkedin: 1300

next_steps:
  enabled: false # when true, agents present next-step options via AskUserQuestion after each phase

feedback:
  enabled: false # when true, agents file GitHub issues on notable events
  repo: tomkaczocha/do-work # GitHub repo (owner/name) for system-class feedback issues
  label: auto:do-work-feedback # label applied to every filed issue; must exist in the target repo
  project_repo: '' # GitHub repo for project-class events; falls back to feedback.repo when empty

parallel:
  stale_threshold_seconds: 900 # seconds of heartbeat silence before a working/ slot is considered stale
  max_workers: 1 # default parallel window width for /do-work run; --parallel N overrides per-run

review:
  required: true # post-build review gate must pass before archive
  adversarial: false # when true AND check-policy.sh exits 2, dispatch 3 lens-scoped reviewers with 2-of-3 majority gate

acceptance:
  evidence_required: true # each acceptance criterion needs passing evidence

risk:
  require_review:
    - migrations
    - auth
    - billing
    - payments
    - files_changed_over: 8
    - acceptance_criteria_over: 6

security:
  blocked_paths:
    - .env
    - .env.*
  blocked_commands:
    - rm -rf
    - git push --force
    - git push -f
    - git reset --hard
    - git checkout --

model:
  default: sonnet
  escalation: opus

cost:
  budget: '' # optional user-defined budget/limit; empty means unset

ledger:
  enabled: true # write .do-work/runs/RUN-NNN.yml records

delivery:
  mode: merge # "merge" (default) or "pr" (push branch + open GitHub PR)
  pr:
    granularity: req # only consulted when mode: pr. "req" = one PR per REQ; "ur" = one PR per UR

worktree:
  link_paths: [] # extra dependency dirs to symlink into each worker worktree
  setup_command: '' # optional fallback run inside the worktree when a dependency dir is absent

verify:
  threshold: 90 # minimum confidence score (0-100) for go to auto-run without --force

notifications:
  on_pending_validation: '' # shell command to run when a REQ parks as pending-validation

# Subagent routing for the run orchestrator. Ordered {match, agent} rules;
# first match wins, fallback is general-purpose. Empty = portable default.
routing: []
