appId: com.tomkaczocha.movieworld
productName: Movie World
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.entertainment
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned build for personal use: no code signing, no notarization.
  # First launch requires right-click -> Open to bypass Gatekeeper.
  identity: null
  notarize: false
  target:
    - dmg
    - dir
  extendInfo:
    - NSDocumentsFolderUsageDescription: Movie World reads and writes movie files and .nfo sidecars in the folders you add to your library.
    - NSDownloadsFolderUsageDescription: Movie World reads movie files from folders you add to your library.
dmg:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
